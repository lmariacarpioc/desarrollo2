<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
    content="width=device-width, initial-scale=1.0">

    <title>Preguntas OMR</title>

    <!-- BOOTSTRAP -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet">

    <!-- FONT AWESOME -->

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->

    <link rel="stylesheet"
    href="../css/styles.css">

    <style>

        .panel{

            background:white;
            padding:30px;
            border-radius:20px;
            box-shadow:0 10px 25px rgba(0,0,0,0.08);
            margin-bottom:25px;

        }

        .question-card{

            background:#f8fafc;
            padding:25px;
            border-radius:20px;
            margin-bottom:20px;
            border:1px solid #e2e8f0;

        }

        .question-image{

            width:100%;
            max-height:350px;
            object-fit:cover;
            border-radius:15px;
            margin-top:15px;

        }

        .bubble{

            width:42px;
            height:42px;
            border-radius:50%;
            border:2px solid #2563eb;
            display:flex;
            align-items:center;
            justify-content:center;
            cursor:pointer;
            transition:0.3s;
            font-weight:bold;

        }

        .bubble:hover{

            background:#dbeafe;

        }

        .selected{

            background:#2563eb;
            color:white;

        }

        .omr-item{

            display:flex;
            align-items:center;
            gap:10px;
            background:#eff6ff;
            padding:15px;
            border-radius:15px;
            margin-bottom:15px;

        }

        .modal-content{

            border-radius:25px;
            border:none;

        }

        .modal-header{

            background:#2563eb;
            color:white;
            border-radius:25px 25px 0 0;

        }

        textarea{

            resize:none;

        }

    </style>

</head>

<body>

<div class="main-container">

    <!-- SIDEBAR -->

    <aside class="sidebar">

        <div class="logo">

            <h2>OMR SYSTEM</h2>

        </div>

        <ul class="menu">

            <li>

                <a href="dashboard.html">

                    <i class="fa-solid fa-chart-line"></i>
                    Dashboard

                </a>

            </li>

            <li>

                <a href="cursos.html">

                    <i class="fa-solid fa-book"></i>
                    Cursos

                </a>

            </li>

            <li>

                <a href="preguntas.html"
                class="active">

                    <i class="fa-solid fa-circle-question"></i>
                    Preguntas

                </a>

            </li>

            <li>

                <a href="respuestas.html">

                    <i class="fa-solid fa-square-check"></i>
                    Respuestas

                </a>

            </li>

            <li>

                <a href="escaneos.html">

                    <i class="fa-solid fa-file-import"></i>
                    Escaneos

                </a>

            </li>

            <li>

                <a href="resultados.html">

                    <i class="fa-solid fa-file-lines"></i>
                    Resultados

                </a>

            </li>

            <li>

                <a href="ranking.html">

                    <i class="fa-solid fa-ranking-star"></i>
                    Ranking

                </a>

            </li>

        </ul>

    </aside>

    <!-- CONTENT -->

    <main class="content">

        <!-- TOPBAR -->

        <div class="topbar">

            <h1>Banco de Preguntas</h1>

            <button
            class="btn btn-primary btn-lg"
            data-bs-toggle="modal"
            data-bs-target="#modalPregunta">

                <i class="fa-solid fa-plus"></i>
                Nueva Pregunta

            </button>

        </div>

        <!-- FILTROS -->

        <div class="panel">

            <div class="row">

                <div class="col-md-4">

                    <label>
                        Carrera
                    </label>

                    <select class="form-select">

                        <option>
                            Medicina
                        </option>

                        <option>
                            Ingeniería
                        </option>

                        <option>
                            Derecho
                        </option>

                    </select>

                </div>

                <div class="col-md-4">

                    <label>
                        Curso
                    </label>

                    <select class="form-select">

                        <option>
                            Biología
                        </option>

                        <option>
                            Matemática
                        </option>

                        <option>
                            Química
                        </option>

                    </select>

                </div>

                </div>

        </div>

        <!-- PREGUNTAS -->

        <div id="contenedorPreguntas">

        </div>

        <!-- OMR DIGITAL -->

        <div class="panel">

            <div class="d-flex justify-content-between align-items-center mb-4">

                <h3>

                    Plantilla OMR Digital

                </h3>

                <button class="btn btn-success"
                onclick="guardarClave()">

                    <i class="fa-solid fa-floppy-disk"></i>
                    Guardar Clave Oficial

                </button>

            </div>

            <div id="omrContainer">

            </div>

        </div>

    </main>

</div>

<!-- MODAL -->

<div class="modal fade"
id="modalPregunta"
tabindex="-1">

    <div class="modal-dialog modal-xl">

        <div class="modal-content">

            <div class="modal-header">

                <h3>

                    Nueva Pregunta

                </h3>

                <button type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal">

                </button>

            </div>

            <div class="modal-body p-4">

                <div class="mb-4">

                    <label class="form-label">

                        Pregunta

                    </label>

                    <textarea
                    id="preguntaTexto"
                    class="form-control"
                    rows="5"
                    placeholder="Ingrese la pregunta completa..."></textarea>

                </div>

                <div class="mb-4">

                    <label class="form-label">

                        Imagen de la Pregunta

                    </label>

                    <input type="file"
                    class="form-control"
                    id="imagenPregunta">

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <input type="text"
                        class="form-control"
                        id="altA"
                        placeholder="Alternativa A">

                    </div>

                    <div class="col-md-6 mb-3">

                        <input type="text"
                        class="form-control"
                        id="altB"
                        placeholder="Alternativa B">

                    </div>

                    <div class="col-md-6 mb-3">

                        <input type="text"
                        class="form-control"
                        id="altC"
                        placeholder="Alternativa C">

                    </div>

                    <div class="col-md-6 mb-3">

                        <input type="text"
                        class="form-control"
                        id="altD"
                        placeholder="Alternativa D">

                    </div>

                </div>

            </div>

            <div class="modal-footer">

                <button class="btn btn-secondary"
                data-bs-dismiss="modal">

                    Cancelar

                </button>

                <button class="btn btn-primary"
                onclick="guardarPregunta()">

                    Guardar Pregunta

                </button>

            </div>

        </div>

    </div>

</div>

<!-- BOOTSTRAP -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- JS -->

<script>

    let contador = 1;

    let respuestas = {};

    const contenedor =
    document.getElementById("contenedorPreguntas");

    const omrContainer =
    document.getElementById("omrContainer");

    // GUARDAR PREGUNTA

    function guardarPregunta(){

        let pregunta =
        document.getElementById("preguntaTexto").value;

        let altA =
        document.getElementById("altA").value;

        let altB =
        document.getElementById("altB").value;

        let altC =
        document.getElementById("altC").value;

        let altD =
        document.getElementById("altD").value;

        let imagen =
        document.getElementById("imagenPregunta").files[0];

        let card =
        document.createElement("div");

        card.className = "question-card";

        let html = `

            <div class="d-flex justify-content-between">

                <h4>

                    Pregunta ${contador}

                </h4>

                <button class="btn btn-danger"
                onclick="eliminarPregunta(this)">

                    <i class="fa-solid fa-trash"></i>

                </button>

            </div>

            <p class="mt-3">

                ${pregunta}

            </p>

            <ul class="mt-4">

                <li>A. ${altA}</li>
                <li>B. ${altB}</li>
                <li>C. ${altC}</li>
                <li>D. ${altD}</li>

            </ul>

        `;

        // IMAGEN

        if(imagen){

            let reader = new FileReader();

            reader.onload = function(e){

                html += `

                    <img src="${e.target.result}"
                    class="question-image">

                `;

                card.innerHTML = html;

            }

            reader.readAsDataURL(imagen);

        }else{

            card.innerHTML = html;

        }

        contenedor.appendChild(card);

        // OMR DIGITAL

        let omr =
        document.createElement("div");

        omr.className = "omr-item";

        omr.innerHTML = `

            <strong style="width:50px;">
                ${contador}
            </strong>

            <div class="bubble"
            onclick="seleccionar(this,${contador},'A')">

                A

            </div>

            <div class="bubble"
            onclick="seleccionar(this,${contador},'B')">

                B

            </div>

            <div class="bubble"
            onclick="seleccionar(this,${contador},'C')">

                C

            </div>

            <div class="bubble"
            onclick="seleccionar(this,${contador},'D')">

                D

            </div>

        `;

        omrContainer.appendChild(omr);

        contador++;

        bootstrap.Modal.getInstance(
            document.getElementById("modalPregunta")
        ).hide();

    }

    // SELECCIONAR RESPUESTA

    function seleccionar(elemento,pregunta,respuesta){

        let fila =
        elemento.parentElement;

        fila.querySelectorAll(".bubble")
        .forEach(b => {

            b.classList.remove("selected");

        });

        elemento.classList.add("selected");

        respuestas[pregunta] = respuesta;

    }

    // ELIMINAR

    function eliminarPregunta(btn){

        btn.parentElement.parentElement.remove();

    }

    // GUARDAR CLAVE

    function guardarClave(){

        console.log(respuestas);

        alert(
            "Clave oficial guardada correctamente."
        );

    }

</script>

</body>

</html>
