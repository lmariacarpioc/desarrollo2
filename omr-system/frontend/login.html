<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body class="login-body">

<div class="login-container">

    <div class="login-box">

        <h2>OMR SYSTEM</h2>

        <p>Inicio de Sesión</p>

        <input type="text" id="usuario" class="form-control mb-3" placeholder="Usuario">

        <input type="password" id="password" class="form-control mb-3" placeholder="Contraseña">

        <button class="btn btn-primary w-100" onclick="login()">
            Ingresar
        </button>

        <hr>

        <h5>Consulta Estudiante</h5>

        <input type="text" id="dni" class="form-control mb-3" placeholder="Ingrese DNI">

        <button class="btn btn-success w-100" onclick="ingresarEstudiante()">
            Consultar Resultado
        </button>

    </div>

</div>

<script src="js/app.js"></script>

</body>

</html>
